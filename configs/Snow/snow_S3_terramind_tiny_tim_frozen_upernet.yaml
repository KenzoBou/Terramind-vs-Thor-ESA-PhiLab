seed_everything: 0
custom_modules_path: ./thor_terratorch_ext
trainer:
  accelerator: gpu
  strategy: auto
  devices: auto
  num_nodes: 1
  precision: 32
  max_epochs: 200
  check_val_every_n_epoch: 1
  accumulate_grad_batches: 1
  log_every_n_steps: 1
  enable_checkpointing: true
  default_root_dir: ./results
  logger:
  - class_path: WandbLogger
    init_args:
      save_dir: ./results
      log_model: true
      name: snow_S3_terramind_tiny_tim_frozen_upernet
  callbacks:
  - class_path: RichProgressBar
  - class_path: LearningRateMonitor
    init_args:
      logging_interval: epoch
  - class_path: EarlyStopping
    init_args:
      monitor: val/loss
      patience: 30
      mode: min
      check_finite: false
      verbose: true
  - class_path: ModelCheckpoint
    init_args:
      monitor: val/loss
      mode: min
      save_top_k: 1
      save_last: true
data:
  class_path: thor_terratorch_ext.datamodules.snow_map_module.SnowMapNonGeoDataModule
  init_args:
    batch_size: 8
    num_workers: 4
    bands:
    - S1_reflectance_an
    - S2_reflectance_an
    - S3_reflectance_an
    - S5_reflectance_an
    - S6_reflectance_an
    train_transform:
    - class_path: albumentations.CropNonEmptyMaskIfExists
      init_args:
        height: 144
        width: 144
        p: 1.0
        ignore_values:
        - 255
    - class_path: ToTensorV2
    val_transform:
    - class_path: albumentations.CenterCrop
      init_args:
        height: 144
        width: 144
        p: 1.0
    - class_path: ToTensorV2
    test_transform:
    - class_path: albumentations.CenterCrop
      init_args:
        height: 144
        width: 144
        p: 1.0
    - class_path: ToTensorV2
    data_root: /shared/home/fschindlegger/thor_terratorch_ext/data/snow/raw/ftp.nr.no/outgoing/jooutgoing/fm4cs/data/snow_dlkdklsd/rev8
    no_label_replace: 255
    no_data_replace: median
    means:
    - 0.3376
    - 0.337
    - 0.4052
    - 0.1829
    - 0.136
    stds:
    - 0.1604
    - 0.1718
    - 0.1745
    - 0.1009
    - 0.0807
model:
  class_path: terratorch.tasks.PixelwiseRegressionTask
  init_args:
    plot_on_val: 1
    loss: mae
    model_factory: EncoderDecoderFactory
    ignore_index: 255
    model_args:
      backbone: terramind_v1_tiny_tim
      backbone_pretrained: true
      decoder: UperNetDecoder
      decoder_channels: 256
      head_dropout: 0.1
      head_channel_list:
      - 256
      necks:
      - name: SelectIndices
        indices:
        - 2
        - 5
        - 8
        - 11
      - name: ReshapeTokensToImage
        remove_cls_token: false
      - name: LearnedInterpolateToPyramidal
      backbone_modalities:
      - S2L2A
      backbone_tim_modalities:
      - LULC
    freeze_backbone: true
    freeze_decoder: false
optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 0.0001
    weight_decay: 0.05
lr_scheduler:
  class_path: ReduceLROnPlateau
  init_args:
    monitor: val/loss
    mode: min
    factor: 0.5
    patience: 20
    threshold: 0.001
