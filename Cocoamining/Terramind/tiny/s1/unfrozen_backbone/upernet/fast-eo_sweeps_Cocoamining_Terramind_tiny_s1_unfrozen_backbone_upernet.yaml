data:
  class_path: cocoamining.cocoamining.CocoaMiningDataModule
  init_args:
    batch_size: 8
    dataset_bands:
    - BLUE
    - RED
    img_grep: IMAGE/IMG_*.tif
    label_grep: MASK/MASK_*.tif
    means:
    - 1465.1607666
    - 1695.578125
    no_data_replace: 0
    no_label_replace: -1
    num_classes: 3
    num_workers: 15
    output_bands:
    - BLUE
    - RED
    split_path: dataset/cocoamining/CocoaMining/2022/train_test_splits.csv
    stds:
    - 148.41740417
    - 285.10070801
    test_data_root: dataset/cocoamining/CocoaMining/2022
    test_transform:
    - class_path: albumentations.Resize
      init_args:
        height: 224
        width: 224
    - class_path: albumentations.pytorch.ToTensorV2
    train_data_root: dataset/cocoamining/CocoaMining/2022
    train_transform:
    - class_path: albumentations.Resize
      init_args:
        height: 224
        width: 224
    - class_path: albumentations.D4
    - class_path: albumentations.pytorch.ToTensorV2
    val_data_root: dataset/cocoamining/CocoaMining/2022
    val_transform:
    - class_path: albumentations.Resize
      init_args:
        height: 224
        width: 224
    - class_path: albumentations.pytorch.ToTensorV2
lr_scheduler:
  class_path: ReduceLROnPlateau
  init_args:
    factor: 0.5
    min_lr: 1e-6
    monitor: val/loss
    patience: 10
model:
  class_path: cocoamining.cocoamining.CocoaMiningTask
  init_args:
    bands_mapping:
      S1RTC:
      - 0
      - 2
    class_names:
    - Background
    - Mining
    - Cocoa
    freeze_backbone: false
    freeze_decoder: false
    ignore_index: -1
    loss: ce
    lr: 2e-5
    model_args:
      backbone: terramind_v1_tiny
      backbone_bands:
        S1RTC:
        - VV
        - VH
      backbone_modalities:
      - S1RTC
      backbone_pretrained: true
      decoder: UperNetDecoder
      decoder_channels: 256
      head_dropout: 0.2
      necks:
      - indices:
        - 2
        - 5
        - 8
        - 11
        name: SelectIndices
      - name: ReshapeTokensToImage
        remove_cls_token: false
      - name: LearnedInterpolateToPyramidal
      num_classes: 3
    model_factory: EncoderDecoderFactory
    plot_on_val: false
optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 2e-5
    weight_decay: 0.05
seed_everything: 0
trainer:
  accelerator: auto
  callbacks:
  - class_path: RichProgressBar
  - class_path: NormalizationCheckCallback
  - class_path: LearningRateMonitor
    init_args:
      logging_interval: epoch
  - class_path: ModelCheckpoint
    init_args:
      monitor: val/loss
      save_last: true
      save_top_k: 1
  - class_path: EarlyStopping
    init_args:
      min_delta: 0.0
      monitor: val/loss
      patience: 30
      verbose: true
  - class_path: src.callbacks.auto_test.AutoTestCallback
  check_val_every_n_epoch: 1
  default_root_dir: outputs
  devices: 1
  enable_checkpointing: true
  log_every_n_steps: 1
  logger:
    class_path: WandbLogger
    init_args:
      group: Cocoamining
      name: Terramind_Upernet_D4
      save_dir: outputs
  max_epochs: 200
  num_nodes: 1
  precision: 16-mixed
  strategy: auto
